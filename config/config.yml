# ============================================================================
# 以下三块是 **sing-box 原生配置的直接透传**（doc/09 §6）
# ============================================================================
#
# 它们不做字段翻译：你写什么，sing-box 就收到什么。键名与 sing-box 官方 JSON 文档
# **完全一致**（snake_case），只是用 YAML 语法书写。
#
# ⚠ 两条必须知道的：
#   1. **未知键会导致整块被拒**，节点起不来。改动前对照你所用基座版本的
#      sing-box 文档核对键名。
#   2. 三块**全部可省略**。省略时：DNS 用 box 默认、出站只有一个 direct、
#      不做任何分流（全部直出）——这就是 v0.0.1 的默认行为。

# ---------------------------------------------------------------------------
# 自定义 DNS（对应 XrayR 的 dns.json）
# ---------------------------------------------------------------------------
# DnsConfig:
#   servers:
#     - tag: google
#       type: tls
#       server: 8.8.8.8
#     - tag: local
#       type: udp
#       server: 223.5.5.5
#   rules:
#     - domain_suffix: [".cn"]
#       server: local
#   strategy: prefer_ipv4   # prefer_ipv4 / prefer_ipv6 / ipv4_only / ipv6_only
#   disable_cache: false

# ---------------------------------------------------------------------------
# 自定义出站（对应 XrayR 的 custom_outbound.json）
# ---------------------------------------------------------------------------
# 省略时等价于只有一个 direct。若你定义了本块但没写 direct，Sing2 会自动在**末尾**
# 追加一个 tag=direct 的出站（追加在末尾不会改变默认出站，只是保证路由规则永远
# 有个 direct 可用）。每个出站**必须有 tag**——路由规则靠 tag 寻址。
#
# OutboundConfig:
#   - type: direct
#     tag: direct
#   # 落地机中转 / 解锁出口
#   - type: socks
#     tag: relay
#     server: 10.0.0.2
#     server_port: 1080
#   # 黑洞：配合 route 的 reject 或直接指向它来丢弃流量
#   - type: block
#     tag: blackhole

# ---------------------------------------------------------------------------
# 分流规则（对应 XrayR 的 route.json）
# ---------------------------------------------------------------------------
# RouteConfig:
#   rules:
#     # 广告拦截（fail closed：命中即断，不会漏过）
#     - domain_suffix: [".doubleclick.net", ".googlesyndication.com"]
#       action: reject
#     # 指定域名走中转出口
#     - domain_suffix: [".netflix.com", ".nflxvideo.net"]
#       outbound: relay
#     # 按 rule-set 分流（见下方 geo 数据说明）
#     - rule_set: ["geosite-cn"]
#       outbound: direct
#   rule_set:
#     - tag: geosite-cn
#       type: remote
#       format: binary
#       url: "https://raw.githubusercontent.com/SagerNet/sing-geosite/rule-set/geosite-cn.srs"
#       download_detour: direct
#   final: direct   # 未命中任何规则时的默认出站
#
# 【geoip / geosite 数据】
# Sing2 的发行包**不含** geoip.dat / geosite.dat——sing-box 用的是自己的 .srs
# rule-set 格式，与 xray 的 .dat 不通用。两种取法：
#   - remote（如上例）：首次启动时自动下载并缓存，需节点能访问该 URL；
#     download_detour 指定用哪个出站去下载。
#   - local：先把 .srs 下载到节点上，然后
#       - tag: geosite-cn
#         type: local
#         format: binary
#         path: /etc/Sing2/geosite-cn.srs
# 规则集索引：https://github.com/SagerNet/sing-geosite ／ sing-geoip

# ---------------------------------------------------------------------------
# 【可选】连接调优（doc/09 §4.2）
# ---------------------------------------------------------------------------
# 整块可省略，省略即完全沿用基座默认。单位一律是整数秒。
# 一份策略作用于所有节点的所有 inbound；面板显式下发的同名字段优先。
#
# ConnectionConfig:
#   UDPTimeout: 300            # UDP 会话空闲多久回收（基座默认约 300）
#   TCPKeepAlive: 15           # 空闲多久发第一个保活探测
#   TCPKeepAliveInterval: 15   # 探测之间的间隔
#   DisableTCPKeepAlive: false # 完全关掉保活探测
#
# ⚠ 从 XrayR 迁过来的注意：XrayR 的 Handshake / ConnIdle / UplinkOnly /
#   DownlinkOnly / BufferSize 是 xray policy 的设置，sing-box 没有 policy 这一层，
#   这五个字段**没有对应能力**。写在这里不会报错，但也不会生效——启动时会逐条
#   告警说明该用什么替代。特别是 ConnIdle：不要直接把它的数值搬到 UDPTimeout，
#   xray 的 connIdle 默认 30 秒且同时管 TCP，照搬会让 UDP 会话在 30 秒被切断。
#   BufferSize 则只能靠 with_low_memory 构建标签调整（缓冲区是编译期常量）。

# ---------------------------------------------------------------------------
# 【可选，仅 Mieru 节点】用户提示强制（doc/09 §5.5）
# ---------------------------------------------------------------------------
# 写在 Nodes[].ControllerConfig 下面：
#
#   ControllerConfig:
#     MieruUserHintIsMandatory: true
#
# 为什么可能需要：mieru 不在线上暴露身份，服务端只能逐个用户试解密。提示没命中
# 时会兜底遍历全部用户，而探测/扫描类垃圾流量必然走这条路且永远认证不成功。
# 用户越多越贵——实测 1000 用户时每次尝试约 2ms，是提示命中路径的 10 倍。
# 开成 true 可彻底关掉这条兜底路径。
#
# ⚠ 代价：mieru < v3.31.0 的老客户端会**连不上**（硬中断，不是降级）。
#   mihomo 当前用 v3.34.0，不受影响。
#
# 不设 = 听面板的（mieru_user_hint / user_hint_is_mandatory）。
#
# 先看数据再开：节点每 5 分钟会评估一次，healthy 时完全静默；真被这条路径吃
# CPU 时会打印带 “全量试解密” 计数的警告并给出处置建议。
