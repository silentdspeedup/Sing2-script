# Sing2 配置示例
# SPDX-License-Identifier: GPL-3.0-or-later
#
# 字段规范见 doc/09-config-and-migration.md。本文件只包含**已实现**的配置项。
#
# 与 XrayR config.yml 的差异：
#   - 删除 DnsConfigPath / InboundConfigPath / OutboundConfigPath /
#     RouteConfigPath 这些「指向 xray json 文件」的路径项；对应能力改为**直接内联**
#     写在本文件里（DnsConfig / OutboundConfig / RouteConfig，见文件末尾）
#   - PanelType 区分 SSpanel（传统 server 串）与 Phoenix（custom_config），必须选对
#   - 新增 AccessLog（访问日志上报）、ConnLimitConfig（并发连接数上限）
#   - ConnectionConfig 字段与 XrayR 不同（xray policy 无对应），见文件末尾

Log:
  Level: warning # none / error / warning / info / debug
  # 运行日志文件。安装脚本按这两个出厂路径配了 logrotate（每天轮转、gzip、保留 7 份），
  # 改路径的话记得同步改 /etc/logrotate.d/Sing2。
  #
  # ⚠ 填了路径之后，**sing-box 侧**的日志只进这个文件、不再进 journald，
  #   Sing2 自己的 [panel] 行仍在 journald。管理脚本会处理这个分流：
  #     sing2 log runtime   # 运行信息，排除逐连接错误
  #     sing2 log failures  # 只看逐连接失败
  #   留空则回到全部走 journald 的老行为。
  ErrorPath: /etc/Sing2/error.log
  # 逐连接访问日志（XrayR 格式）：
  #   2026/07/26 21:28:32.280338 from 120.192.185.114:57046 accepted tcp:1.1.1.1:53 \
  #     [Mieru_0.0.0.0_2999 >> direct] email: 1165394586@qq.com|7720
  # email 字段是「邮箱|uid」；NodeTag 不重复写，它已经在 [in >> out] 那一列里。
  # 客户端 IP 一律规范化：双栈监听下 IPv4 会被报成 ::ffff:1.2.3.4，这里还原成 1.2.3.4。
  # 注意：协议鉴权失败（invalid user）不会出现在这里——那类连接在 inbound 内部
  # 就被拒了，进不了路由，看运行日志（Level 调到 info/debug）。
  # 留空 = 不写访问日志。
  AccessPath: /etc/Sing2/access.log
  # 访问日志时间戳的时区。留空 = 本机时区。
  # 固定偏移（+08:00 / +0800 / +8）永远可用；Asia/Shanghai 这类 IANA 名需系统有 tzdata。
  Timezone: # +08:00

# 访问日志上报（进程级，可选）。面板需实现 POST /mod_mu/users/accesslog。
AccessLog:
  Enable: false
  ReportInvalidUser: true # 无用户的探测行是否上报
  ProbeReportPolicy: broadcast # broadcast / first / none
  BatchSize: 500 # 攒够多少条即 flush
  FlushInterval: 3s # 至少多久 flush 一次
  MaxBatch: 1000 # 单次 POST 上限，须 ≤ 面板侧单批入库上限
  BufferMax: 50000 # 每节点内存缓冲上限，满时丢最旧
  IngestChanSize: 100000 # 热路径投递通道容量，满即丢弃、绝不阻塞转发

Nodes:
  # ——— 节点 1：V2ray（VMess / VLESS，传统 SSpanel 或 Phoenix 均可）———
  - PanelType: SSpanel # SSpanel=传统 server 串 / Phoenix=custom_config，选错节点起不来
    ApiConfig:
      ApiHost: http://panel.example.com
      ApiKey: your-mu-key
      NodeID: 1
      NodeType: V2ray # V2ray / Vmess / Vless / Trojan / Shadowsocks / Mieru …
      Timeout: 30
      # VMess 还是 VLESS：面板 server 串里的 enable_vless 优先，这里只是兜底。
      # 同一份配置因此能同时服务 VMess-TCP / VMess-WS-TLS / VLESS-Vision-REALITY
      # 三种节点（doc/13 T2）。
      EnableVless: false
      VlessFlow: xtls-rprx-vision # 置此值时 TLS 或 REALITY 必须开启
      SpeedLimit: 0 # Mbps，本地设置会覆盖面板下发，0 = 不限
      DeviceLimit: 0 # 本地设置会覆盖面板下发，0 = 不限
      RuleListPath: # /etc/Sing2/rulelist

    ControllerConfig:
      ListenIP: 0.0.0.0
      SendIP: 0.0.0.0
      UpdatePeriodic: 60 # 面板同步周期（秒）
      EnableDNS: false
      DNSType: AsIs # AsIs / UseIP / UseIPv4 / UseIPv6
      # 接受入站 PROXY protocol，可与 haproxy 的 send-proxy 配合（doc/09 §5.3）。
      # 覆盖 vless / vmess / trojan / shadowsocks / anytls / mieru / trusttunnel；
      # hysteria2 / tuic 是 QUIC，PROXY protocol 只管 TCP，对它们开会直接报错。
      # 没带 PROXY 头的连接照常服务，用真实 socket 地址。
      #
      # ⚠ 谁发的头都信。PROXY 头是未经认证的身份声明，任何能连上这个端口的人都能
      #   声称自己是任意 IP，从而绕过设备上限、污染访问日志、让溯源失效。
      #   **请用防火墙或私网把该端口限制到你的负载均衡器**——这是唯一的防线。
      EnableProxyProtocol: false
      # EnableFallback 未接线（基座只有 Trojan 还保留回落）。
      EnableFallback: false

      # 节点本地 REALITY。私钥只能放在这里——面板的 server 串同时用于渲染用户
      # 订阅，写进去等于发给每个客户端（doc/13 T3）。
      # 合并语义：私钥 / Dest 取本地；ServerNames / ShortIds 优先取面板下发，
      # 因此一份 REALITYConfigs 可服务多个 REALITY 节点。
      EnableREALITY: false
      # ⚠ 传统面板下必须保持 false。设成 true 会跳过整个本地合并，于是
      #   Dest 和 PrivateKey 都为空——而 6 段式 server 串只带客户端那一半
      #   （servername / reality_short_id / reality_public_key），给不出这两个值，
      #   节点会直接起不来（报 "REALITY dest is empty"）。
      #   它只对 native 方言有意义：那里面板体本身就是完整的 sing-box inbound，
      #   自带 tls.reality{}（含 private_key）。
      DisableLocalREALITYConfig: false
      REALITYConfigs:
        Show: false
        Dest: www.microsoft.com:443
        ProxyProtocolVer: 0
        ServerNames:
          - www.microsoft.com
        PrivateKey: # x25519 私钥，用 `sing2 x25519` 或 xray x25519 生成
        MinClientVer:
        MaxClientVer:
        MaxTimeDiff: 0
        ShortIds:
          - ""

      # 动态限速：周期流量超 Limit 且累计 WarnTimes 次后降速到 LimitSpeed，
      # 持续 LimitDuration 分钟后释放。Limit=0 关闭。
      AutoSpeedLimitConfig:
        Limit: 0 # Mbps
        WarnTimes: 0
        LimitSpeed: 0 # Mbps
        LimitDuration: 0 # 分钟

      # 跨节点在线设备数限制：不在这里配置。
      # SSpanel 系（传统 SSpanel / Phoenix 都是）自带这条通路——各节点上报在线 IP，
      # 面板汇总出全网 alive_ip 再随用户列表下发，节点按
      # node_iplimit − alive_ip + 本节点上次上报数 算出本节点还能给几个设备。
      # 每用户上限在面板的 node_iplimit 里设；想在节点侧统一压低用 ApiConfig.DeviceLimit。
      # XrayR 的 GlobalDeviceLimitConfig（Redis 通路）已移除，写在这里会被忽略。

      # 每用户并发连接数上限（Sing2 净新增，XrayR 无此能力）
      ConnLimitConfig:
        Enable: false
        MaxConnPerUser: 0

      CertConfig:
        CertMode: none # none / file / http / dns / tls
        CertDomain: node1.example.com
        CertFile: /etc/Sing2/cert/node1.example.com.crt
        KeyFile: /etc/Sing2/cert/node1.example.com.key
        Provider: cloudflare # CertMode=dns 时的 DNS provider
        Email: admin@example.com
        DNSEnv:
          CLOUDFLARE_DNS_API_TOKEN: your-token

